<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Broker Admin · BrokerProReviews</title>
<style>body{font:16px system-ui;background:#0b1220;color:#f5f7fb;margin:0}main{max-width:1100px;margin:40px auto;padding:24px}h1{margin-bottom:4px}.muted{color:#a9b7cc}.panel{background:#142139;border:1px solid #31435d;border-radius:12px;padding:22px;margin:20px 0}label{display:block;margin:12px 0 6px}input,textarea,button{font:inherit;border-radius:7px;padding:9px}input,textarea{background:#0b1220;border:1px solid #789;color:#fff;box-sizing:border-box;width:100%}button{background:#7bddcf;color:#08212b;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #33465e;padding:10px;text-align:left}td button{margin-right:8px}.error{color:#ffb3b3}.ok{color:#9ff2c7}@media(max-width:600px){main{padding:12px;margin:8px}table{font-size:13px}}</style></head>
<body><main><h1>Broker management</h1><p class="muted">Protected by Cloudflare Access. Changes are recorded in the audit history. No changes publish until you save.</p>
<section class="panel"><h2>Broker records</h2><p id="status" role="status">Loading…</p><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Rating</th><th>Action</th></tr></thead><tbody id="brokers"></tbody></table></div></section>
<section class="panel"><h2>Create / edit broker</h2><form id="brokerForm"><label for="id">ID (lowercase, hyphen or underscore)</label><input id="id" required pattern="[a-z0-9_-]{1,80}" maxlength="80"><label for="name">Broker name</label><input id="name" required maxlength="120"><label for="rating">Editorial rating (0–5, requires verified methodology)</label><input id="rating" type="number" min="0" max="5" step=".1"><button type="submit">Save broker</button></form></section>
<section class="panel"><h2>Recent audit events</h2><button id="history" type="button">Refresh history</button><pre id="events" style="white-space:pre-wrap;word-break:break-word"></pre></section>
</main><script src="/admin/admin.js" defer></script></body></html>
