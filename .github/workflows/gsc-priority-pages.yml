name: GSC priority page quality
on:
  pull_request:
    paths:
      - 'site1-dark-gradient/index.html'
      - 'site1-dark-gradient/brokers/**'
      - 'site1-dark-gradient/latam/**'
      - 'scripts/check-gsc-priority-pages.mjs'
      - '.github/workflows/gsc-priority-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-gsc-priority-pages.mjs
