name: Featured broker logo availability
on:
  pull_request:
    paths:
      - 'site1-dark-gradient/index.html'
      - 'site1-dark-gradient/styles.css'
      - 'site1-dark-gradient/assets/brokers/**'
      - 'scripts/check-featured-broker-logos.mjs'
      - '.github/workflows/featured-broker-logos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-featured-broker-logos.mjs
