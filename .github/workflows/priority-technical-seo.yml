name: Priority technical SEO audit
on:
  pull_request:
    paths:
      - 'scripts/audit-priority-page-seo.mjs'
      - '.github/workflows/priority-technical-seo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit-priority-page-seo.mjs
      - run: node scripts/monitor-public-seo.mjs
