name: Live production font and logos smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-live-production-browser.mjs'
      - '.github/workflows/live-production-browser.yml'
  schedule:
    - cron: '15 8 * * 4'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-live-production-browser.mjs
