name: Broker evidence checks
on:
  pull_request:
    paths:
      - 'data/broker-research-evidence.json'
      - 'scripts/check-broker-research.mjs'
      - '.github/workflows/broker-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-broker-research.mjs
