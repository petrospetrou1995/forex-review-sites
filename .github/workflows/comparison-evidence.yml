name: Comparison evidence quality
on:
  pull_request:
    paths:
      - 'site1-dark-gradient/compare/**'
      - 'scripts/generate-compare-pages.mjs'
      - 'scripts/check-comparison-evidence.mjs'
      - '.github/workflows/comparison-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-comparison-evidence.mjs
