name: Forex cost calculator
on:
  pull_request:
    paths:
      - 'site1-dark-gradient/tools/forex-cost-calculator/**'
      - 'tests/forex-cost-calculator.test.mjs'
      - '.github/workflows/forex-cost-calculator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/forex-cost-calculator.test.mjs
      - run: node tests/comparison-calculator-links.test.mjs
