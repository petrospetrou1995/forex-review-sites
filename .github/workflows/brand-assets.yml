name: Broker asset identity audit
on:
  pull_request:
    paths:
      - 'data/broker-brand-assets.json'
      - 'site1-dark-gradient/assets/brokers/**'
      - 'site1-dark-gradient/index.html'
      - 'scripts/audit-brand-assets.mjs'
      - '.github/workflows/brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit-brand-assets.mjs
