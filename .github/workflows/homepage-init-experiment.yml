name: Homepage initialization mobile experiment
on:
  pull_request:
    paths:
      - '.github/workflows/homepage-init-experiment.yml'
      - 'scripts/compare-homepage-init.mjs'
      - 'site1-dark-gradient/translations.js'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare unchanged and optimized pages
        shell: bash
        run: |
          set -euo pipefail
          cp -a site1-dark-gradient optimized
          cp -a site1-dark-gradient baseline
          python3 - <<'PY'
          from pathlib import Path
          p=Path('baseline/translations.js')
          s=p.read_text()
          replacement='applyLanguage(currentLang);const prepareBelowFold=()=>{initReviewCounts(),initReviewViewMore(),sortNewsCardsByDatetimeDesc(),initDailyBriefsToggle(),initRelativeTimes()};"requestIdleCallback"in window?window.requestIdleCallback(prepareBelowFold,{timeout:1500}):window.setTimeout(prepareBelowFold,250);'
          original='applyLanguage(currentLang),initReviewCounts(),initReviewViewMore(),sortNewsCardsByDatetimeDesc(),initDailyBriefsToggle(),initRelativeTimes();'
          assert s.count(replacement)==1
          p.write_text(s.replace(replacement,original))
          PY
          python3 -m http.server 8123 --bind 127.0.0.1 --directory baseline > /tmp/homepage-baseline.log 2>&1 &
          python3 -m http.server 8124 --bind 127.0.0.1 --directory optimized > /tmp/homepage-optimized.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8123/ -o /dev/null
          curl --fail http://127.0.0.1:8124/ -o /dev/null
      - name: Benchmark baseline and optimized render
        shell: bash
        run: |
          set -euo pipefail
          arms=(baseline optimized optimized baseline baseline optimized)
          a=0
          b=0
          for arm in "${arms[@]}"; do
            if [ "$arm" = baseline ]; then a=$((a+1)); n="$a"; url='http://127.0.0.1:8123/'
            else b=$((b+1)); n="$b"; url='http://127.0.0.1:8124/'; fi
            npx --yes lighthouse@12 "$url" \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --throttling-method=simulate \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance \
              --output=json \
              --output-path="./${arm}-${n}.json" \
              --quiet
          done
      - run: node scripts/compare-homepage-init.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-init-experiment
          path: |
            baseline-*.json
            optimized-*.json
          retention-days: 7
