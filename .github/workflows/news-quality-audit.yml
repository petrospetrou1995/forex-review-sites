name: News quality audit
on:
  pull_request:
    paths:
      - 'scripts/audit-news-quality.mjs'
      - '.github/workflows/news-quality-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run non-destructive report
        run: node scripts/audit-news-quality.mjs > news-quality-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: news-quality-report
          path: news-quality-report.json
