name: Logo clarity and integrity
on:
  pull_request:
    paths:
      - 'site1-dark-gradient/index.html'
      - 'site1-dark-gradient/styles.css'
      - 'scripts/check-logo-clarity.mjs'
      - '.github/workflows/logo-clarity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-logo-clarity.mjs
