name: Featured broker browser rendering
on:
  pull_request:
    paths:
      - 'site1-dark-gradient/index.html'
      - 'site1-dark-gradient/styles.css'
      - 'scripts/check-broker-logo-browser.mjs'
      - '.github/workflows/featured-broker-rendering.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - name: Start static local site
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory site1-dark-gradient > /tmp/brokerpro-http.log 2>&1 &
          sleep 2
      - name: Validate responsive logo rendering
        run: node scripts/check-broker-logo-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broker-logo-responsive-screenshots
          path: broker-logo-screenshots/
          if-no-files-found: ignore
          retention-days: 7
