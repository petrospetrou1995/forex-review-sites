name: GA4 low fetch-priority preview comparison
on:
  pull_request:
    paths:
      - '.github/workflows/ga-priority-preview-comparison.yml'
      - 'scripts/compare-preview-prod.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare production to staged preview
        shell: bash
        run: |
          set -euo pipefail
          production='https://brokerproreviews.com/'
          preview='https://2693b6d4.brokerproreviews.pages.dev/'
          # This preview deployment has the proposed fetchpriority=low HTML change.
          order=(production preview preview production production preview)
          count_production=0
          count_preview=0
          for variant in "${order[@]}"; do
            if [ "$variant" = production ]; then
              count_production=$((count_production+1))
              n="$count_production"
              url="$production"
            else
              count_preview=$((count_preview+1))
              n="$count_preview"
              url="$preview"
            fi
            npx --yes lighthouse@12 "$url" \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --throttling-method=simulate \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance \
              --output=json \
              --output-path="./${variant}-${n}.json" \
              --quiet
          done
      - name: Compare measured medians
        run: node scripts/compare-preview-prod.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-priority-preview-comparison
          path: |
            production-*.json
            preview-*.json
          retention-days: 7
